#
# Database Connection Properties
# Update these values to match your local MySQL setup
#

# JDBC Driver
jdbc.driver=com.mysql.cj.jdbc.Driver

# JDBC URL — change host/port/database name if needed
jdbc.url=jdbc:mysql://localhost:3307/web_customer_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Database credentials
jdbc.user=springstudent
jdbc.password=springstudent

#
# Hibernate Properties
#
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
hibernate.show_sql=true
hibernate.format_sql=false
# "update" = create tables if missing, alter if schema changes
# Use "create" for first run on an empty DB, "validate" in production
hibernate.hbm2ddl.auto=update
